################################################################################
# Docker Compose File
#
# This Docker File intend to Create a Complete Dev Environment
# for Splash SendInBlue Connector
#
# For a faster access to you container, you can add this IP to /etc/hosts
# 
# 172.110.0.100       toolkit.mailchimp.local
# 172.110.0.101       sandbox.mailchimp.local
#
################################################################################

name: "splash-mailchimp"

services:
    
    ################################################################################
    # Splash Toolkit Container   
    toolkit:
        image:              'splashsync/toolkit:3.0'
        container_name:     mailchimp-toolkit
        volumes:
            # Specify Local Configuration File
            - './config/packages/splash.yaml:/app/config/packages/splash.yaml:ro'
            # Uncomment to use Local Sources instead of Release
            - './src/:/app/connectors/MailChimp/:ro'
        hostname:           toolkit.mailchimp.local
        env_file:           .env
        tty:                true
        networks:
            mailchimp:      { ipv4_address: 172.110.0.100, aliases: [ toolkit.mailchimp.local ] }
            splashsync:     { aliases: [ toolkit.mailchimp.local ] }

    ################################################################################
    # Mailjet API SandBox
    sandbox:
        build:
            context:        ./docker/sandbox
            dockerfile:     Dockerfile
        container_name:     sandbox.mailchimp.local
        hostname:           sandbox.mailchimp.local
        tty:                true
        volumes:
            - './docker/sandbox/Entity/:/app/src/Entity/:ro'
            - './docker/sandbox/Controller/:/app/src/Controller/:ro'
            - './docker/sandbox/Command/:/app/src/Command/:ro'
            - './docker/sandbox/Serializer/:/app/src/Serializer/:ro'
            - './docker/sandbox/config.yaml:/app/config/packages/config.yaml:ro'
        networks:
            mailchimp:     { ipv4_address: 172.110.0.101, aliases: [ sandbox.mailchimp.local ] }

    ################################################################################
    # PHP 8.3
    php-8.3:
        image:          registry.gitlab.com/badpixxel-projects/php-sdk:php-8.3
        container_name: mailchimp-php-8.3
        volumes:
            - ./:/var/www/html
            - vendor-php83:/var/www/html/vendor

networks:
    ################################################################################
    # Default Private Network    
    mailchimp:
        driver: bridge
        ipam:
            config:
                - subnet: 172.110.0.0/24
    ################################################################################
    # External Splash Network
    splashsync:
        external: true

volumes:
    vendor-php83: ~
