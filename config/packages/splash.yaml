parameters:
    # Adds a fallback configuration if the env var is not set.
    env(MC_API_KEY): 'ThisIsSecretApiKey'
    env(MC_API_LIST): 'ThisIsSecretApiList'

splash:

    ################################################################################
    # List of Available Connector Connections
    ################################################################################
    connections:
        
        ########################################################################
        # MailChimp Default / Staging
        staging:
            id:                 ThisIsMailChimpWsId
            key:                ThisIsNotASecretKeyForMailChimp
            name:               MailChimp - Staging
            connector:          mailchimp
            config:
                WsHost:         http://localhost:8000
                ApiKey:         "%env(resolve:MC_API_KEY)%"
                ApiList:        "%env(resolve:MC_API_LIST)%"

        ########################################################################
        # MailChimp Sandbox
        sandbox:
            id:                 ThisIsMailChimpSandboxWsId
            key:                ThisIsNotASecretKeyForMailChimpSandbox
            name:               MailChimp - Sandbox
            connector:          mailchimp
            config:
                isSandbox:      true
                WsHost:         http://sandbox.mailchimp.local
                ApiKey:         "ThisIsSecretApiKey-sandbox"
                ApiList:        "1"
